name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests, analysis & APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Static analysis (non-blocking baseline)
        continue-on-error: true
        run: ./gradlew detekt

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Guarantee APK is signed and installable
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          if ! "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            mkdir -p "$HOME/.android"
            if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
              keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Oxxi Android Debug,O=Oxxi,C=US" -noprompt
            fi
            "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
          fi
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" Oxxi.apk
          test -s Oxxi.apk
          ls -lh Oxxi.apk

      - name: Release build + R8 keep-rule check
        run: ./gradlew assembleRelease verifyReleaseKeepRules --stacktrace

      - name: Publish APK artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Oxxi-Android-APK
          path: Oxxi.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub release for Oxxi updater
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s Oxxi.apk
          TAG="v0.20.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Oxxi.apk --clobber
          else
            gh release create "$TAG" Oxxi.apk --title "Oxxi 0.20.${GITHUB_RUN_NUMBER}" --generate-notes
          fi

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
